name: GitHub Models PR Review

on:
  pull_request:
    branches:
      - pr_test_llm
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_review:
    name: AI-Powered PR Review with GitHub Models
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
      - name: Advanced diff processing with strict token limits
        run: |
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          ESTIMATED_TOKENS=$((DIFF_SIZE / 4))
          
          # Much more conservative token limits for GPT-4o-mini
          MAX_DIFF_TOKENS=4000  # Reduced from 6000 to account for prompt overhead
          SAFE_DIFF_TOKENS=3500 # Even safer limit
          
          echo "Original diff size: $DIFF_SIZE bytes (~$ESTIMATED_TOKENS tokens)"
          echo "Max allowed tokens: $MAX_DIFF_TOKENS"
          
          if [ $ESTIMATED_TOKENS -gt $MAX_DIFF_TOKENS ]; then
            echo "⚠️  Diff exceeds token limits, applying advanced filtering..."
            
            # Get changed files with their sizes
            git diff origin/${{ github.base_ref }}...HEAD --name-only > all_changed_files.txt
            
            # Create file priority and size analysis
            > priority_analysis.txt
            while read -r file; do
              if [ -n "$file" ] && [ -f "$file" ]; then
                FILE_DIFF_SIZE=$(git diff origin/${{ github.base_ref }}...HEAD -- "$file" | wc -c)
                FILE_TOKENS=$((FILE_DIFF_SIZE / 4))
                
                # Assign priority scores
                PRIORITY=3  # Default low priority
                
                # High priority patterns
                if echo "$file" | grep -qE '\.(js|jsx|ts|tsx|py|java|go|rs|php|rb|swift|kt|scala|cs|cpp|c|h|hpp)$'; then
                  PRIORITY=1
                elif echo "$file" | grep -qE 'package\.json|package-lock\.json|requirements\.txt|Dockerfile|\.env|config\.|\.yml$|\.yaml$'; then
                  PRIORITY=1
                # Medium priority
                elif echo "$file" | grep -qE '\.(test\.|spec\.|_test\.py|test_.*\.py)$'; then
                  PRIORITY=2
                elif echo "$file" | grep -qE '\.(md|rst|css|scss)$'; then
                  PRIORITY=2
                fi
                
                echo "$PRIORITY:$FILE_TOKENS:$file" >> priority_analysis.txt
              fi
            done < all_changed_files.txt
            
            # Sort by priority (1=high, 2=medium, 3=low) then by size (smaller first)
            sort -t: -k1,1n -k2,2n priority_analysis.txt > sorted_files.txt
            
            # Build focused diff within token limits
            echo "# Focused Code Review - Token-Limited Analysis" > focused_diff.txt
            echo "" >> focused_diff.txt
            echo "**Note:** This review covers the most critical files due to diff size constraints." >> focused_diff.txt
            echo "" >> focused_diff.txt
            
            CURRENT_TOKENS=100  # Account for headers
            FILES_INCLUDED=0
            
            while IFS=':' read -r priority tokens filepath; do
              if [ -n "$filepath" ] && [ $((CURRENT_TOKENS + tokens)) -lt $SAFE_DIFF_TOKENS ]; then
                echo "### File: \`$filepath\` (Priority: $priority)" >> focused_diff.txt
                echo "" >> focused_diff.txt
                git diff origin/${{ github.base_ref }}...HEAD -- "$filepath" >> focused_diff.txt
                echo "" >> focused_diff.txt
                CURRENT_TOKENS=$((CURRENT_TOKENS + tokens))
                FILES_INCLUDED=$((FILES_INCLUDED + 1))
                
                echo "✓ Included $filepath ($tokens tokens, running total: $CURRENT_TOKENS)"
              else
                echo "✗ Skipped $filepath ($tokens tokens) - would exceed limit"
              fi
            done < sorted_files.txt
            
            echo "" >> focused_diff.txt
            echo "---" >> focused_diff.txt
            echo "**Files included in review:** $FILES_INCLUDED" >> focused_diff.txt
            echo "**Estimated tokens:** $CURRENT_TOKENS" >> focused_diff.txt
            
            mv focused_diff.txt pr_diff.txt
            
            NEW_SIZE=$(wc -c < pr_diff.txt)
            NEW_TOKENS=$((NEW_SIZE / 4))
            echo "✅ Final diff: $NEW_SIZE bytes (~$NEW_TOKENS tokens)"
            
          else
            echo "✅ Diff size within limits"
          fi
          
          # Final safety truncation if still too large
          FINAL_SIZE=$(wc -c < pr_diff.txt)
          FINAL_TOKENS=$((FINAL_SIZE / 4))
          
          if [ $FINAL_TOKENS -gt $SAFE_DIFF_TOKENS ]; then
            echo "⚠️  Applying emergency truncation..."
            # Conservative character limit (3500 tokens * 4 chars/token)
            head -c 14000 pr_diff.txt > truncated.txt
            echo "" >> truncated.txt
            echo "--- REVIEW TRUNCATED: DIFF TOO LARGE FOR MODEL ---" >> truncated.txt
            mv truncated.txt pr_diff.txt
            echo "Emergency truncated to: $(wc -c < pr_diff.txt) bytes"
          fi
          
          # Clean up
          rm -f all_changed_files.txt priority_analysis.txt sorted_files.txt

      - name: Review PR with GitHub Models
        id: review_with_github_models
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let prDiff = '';
            try {
              prDiff = fs.readFileSync('pr_diff.txt', 'utf8');
            } catch (error) {
              console.log('No diff file found or empty diff');
              return;
            }
            
            if (!prDiff.trim()) {
              console.log('Empty diff, skipping review');
              return;
            }

            // More concise prompt to save tokens
            const prompt = `Review this git diff focusing on critical issues, security, and best practices. Be concise but thorough:

            \`\`\`diff
            ${prDiff}
            \`\`\`

            Structure your response as:
            ## Summary
            Brief overview of changes and overall assessment.

            ## Critical Issues
            High-priority problems requiring immediate attention.

            ## Key Findings
            | File | Issue | Severity | Recommendation |
            |------|-------|----------|----------------|

            ## Security & Performance
            Notable security or performance concerns.

            ## Recommendations  
            Top 3-5 actionable improvements.`;

            try {
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${{ secrets.GH_PAT_MODELS }}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'GitHub-Actions-PR-Review/1.0'
                },
                body: JSON.stringify({
                  messages: [
                    {
                      role: "system",
                      content: "You are a senior code reviewer. Provide concise, actionable feedback focusing on critical issues, security, and best practices."
                    },
                    {
                      role: "user", 
                      content: prompt
                    }
                  ],
                  model: "gpt-4o-mini",
                  temperature: 0.1,
                  max_tokens: 2500  // Reduced to leave more room for input
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                
                // If still hitting token limits, try with even smaller diff
                if (response.status === 413 || errorText.includes('tokens_limit_reached')) {
                  console.log('Still hitting token limit, creating fallback review...');
                  
                  const fallbackReview = `## AI Code Review - Large Diff Summary

            This pull request contains a large number of changes that exceed the AI model's token limits for detailed analysis.

            **Diff Statistics:**
            - **Size:** ${prDiff.length} characters
            - **Estimated tokens:** ${Math.floor(prDiff.length / 4)}

            ### Manual Review Recommended
            Due to the size of this diff, please ensure:

            1. **Security Review:** Manually check for security vulnerabilities
            2. **Testing:** Verify all changes are covered by appropriate tests  
            3. **Performance:** Review for potential performance impacts
            4. **Documentation:** Ensure documentation is updated as needed
            5. **Breaking Changes:** Confirm backward compatibility

            ### Changed Files Preview
            The following files were modified:
            ${prDiff.split('\n').filter(line => line.startsWith('diff --git')).slice(0, 10).map(line => `- \`${line.split(' ')[3]?.replace('b/', '') || 'Unknown'}\``).join('\n')}
            ${prDiff.split('\n').filter(line => line.startsWith('diff --git')).length > 10 ? '\n- *...and more files*' : ''}

            ---
            *This is an automated message due to diff size limitations.*`;

                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: fallbackReview
                  });
                  
                  return;
                }
                
                throw new Error(`GitHub Models API error: ${response.status} ${response.statusText} - ${errorText}`);
              }

              const data = await response.json();
              const reviewContent = data.choices[0].message.content;
              
              const reviewComment = `## AI Code Review Report

            ${reviewContent}

            ---
            **Review Details:**
            - **Model:** GitHub Models GPT-4o-mini  
            - **Generated:** ${new Date().toLocaleString()}
            - **Diff Size:** ${prDiff.length} characters (~${Math.floor(prDiff.length / 4)} tokens)

            > This review is AI-generated. Please verify suggestions before implementing changes.`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewComment
              });

              console.log('✅ PR review comment posted successfully');
              
            } catch (error) {
              console.error('Error calling GitHub Models API:', error);
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## AI Code Review - Error

            An error occurred while generating the code review:

            \`\`\`
            ${error.message}
            \`\`\`

            Please check the workflow logs for more details and consider manually reviewing this large diff.`
              });
              
              core.setFailed('Failed to generate AI review: ' + error.message);
            }

      - name: Show diff info
        if: always()
        run: |
          if [ -f pr_diff.txt ]; then
            echo "Final diff size: $(wc -c < pr_diff.txt) bytes"
            echo "Estimated tokens: $(( $(wc -c < pr_diff.txt) / 4 ))"
            echo "Line count: $(wc -l < pr_diff.txt)"
          else
            echo "No diff file found"
          fi