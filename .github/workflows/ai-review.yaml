name: GitHub Models PR Review

on:
  pull_request:
    branches:
      - pr_test_llm
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_review:
    name: AI-Powered PR Review with GitHub Models
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
      - name: Check diff size and apply file priority filtering
        run: |
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          ESTIMATED_TOKENS=$((DIFF_SIZE / 4))
          
          echo "Original diff size: $DIFF_SIZE bytes (~$ESTIMATED_TOKENS tokens)"
          
          # If diff is too large, apply priority filtering
          if [ $ESTIMATED_TOKENS -gt 6000 ]; then
            echo "⚠️  Diff exceeds token limits, applying priority file filtering..."
            
            # Get list of all changed files
            git diff origin/${{ github.base_ref }}...HEAD --name-only > all_changed_files.txt
            echo "Total files changed: $(wc -l < all_changed_files.txt)"
            
            # Define priority file patterns (will work in any subdirectory)
            # High priority: source code, configs, security files
            grep -E '\.(js|jsx|ts|tsx|py|java|go|rs|php|rb|swift|kt|scala|cs|cpp|c|h|hpp)$|package\.json|package-lock\.json|yarn\.lock|requirements\.txt|Gemfile|Cargo\.toml|pom\.xml|build\.gradle|Dockerfile|docker-compose\.yml|\.env|\.env\.|config\.|\.config|\.yml$|\.yaml$|\.toml$|\.ini$|\.conf$|Makefile|CMakeLists\.txt' all_changed_files.txt > priority_files.txt || touch priority_files.txt
            
            # Medium priority: documentation, tests, styles
            grep -E '\.(md|rst|txt|test\.js|spec\.js|\.test\.|\.spec\.|test_.*\.py|.*_test\.py|\.css|\.scss|\.sass|\.less|\.styl)$|README|CHANGELOG|LICENSE' all_changed_files.txt > medium_priority_files.txt || touch medium_priority_files.txt
            
            echo "High priority files found: $(wc -l < priority_files.txt)"
            echo "Medium priority files found: $(wc -l < medium_priority_files.txt)"
            
            # Create focused diff starting with high priority files
            echo "# Focused Code Review - Priority Files Only" > focused_diff.txt
            echo "" >> focused_diff.txt
            
            if [ -s priority_files.txt ]; then
              echo "## High Priority Files (Source Code & Configuration)" >> focused_diff.txt
              echo "" >> focused_diff.txt
              
              while read -r file; do
                if [ -n "$file" ]; then
                  echo "### File: \`$file\`" >> focused_diff.txt
                  echo "" >> focused_diff.txt
                  git diff origin/${{ github.base_ref }}...HEAD -- "$file" >> focused_diff.txt
                  echo "" >> focused_diff.txt
                fi
              done < priority_files.txt
            fi
            
            # Check if we have space for medium priority files
            CURRENT_SIZE=$(wc -c < focused_diff.txt)
            CURRENT_TOKENS=$((CURRENT_SIZE / 4))
            
            if [ $CURRENT_TOKENS -lt 4000 ] && [ -s medium_priority_files.txt ]; then
              echo "## Medium Priority Files (Tests & Documentation)" >> focused_diff.txt
              echo "" >> focused_diff.txt
              
              while read -r file; do
                if [ -n "$file" ]; then
                  # Add file only if we don't exceed token limit
                  git diff origin/${{ github.base_ref }}...HEAD -- "$file" > temp_file_diff.txt
                  TEMP_SIZE=$(wc -c < temp_file_diff.txt)
                  TEMP_TOKENS=$((TEMP_SIZE / 4))
                  
                  if [ $((CURRENT_TOKENS + TEMP_TOKENS)) -lt 5500 ]; then
                    echo "### File: \`$file\`" >> focused_diff.txt
                    echo "" >> focused_diff.txt
                    cat temp_file_diff.txt >> focused_diff.txt
                    echo "" >> focused_diff.txt
                    CURRENT_TOKENS=$((CURRENT_TOKENS + TEMP_TOKENS))
                  else
                    echo "### Remaining files truncated due to token limits" >> focused_diff.txt
                    break
                  fi
                fi
              done < medium_priority_files.txt
            fi
            
            # Replace original diff with focused version
            mv focused_diff.txt pr_diff.txt
            
            NEW_SIZE=$(wc -c < pr_diff.txt)
            NEW_TOKENS=$((NEW_SIZE / 4))
            echo "✅ Focused diff size: $NEW_SIZE bytes (~$NEW_TOKENS tokens)"
            
            # Final safety check - truncate if still too large
            if [ $NEW_TOKENS -gt 7000 ]; then
              echo "⚠️  Still too large after filtering, applying final truncation..."
              head -c 28000 pr_diff.txt > truncated_diff.txt
              echo "" >> truncated_diff.txt
              echo "--- REVIEW TRUNCATED DUE TO TOKEN LIMITS ---" >> truncated_diff.txt
              mv truncated_diff.txt pr_diff.txt
              echo "Final size: $(wc -c < pr_diff.txt) bytes"
            fi
            
          else
            echo "✅ Diff size within limits, proceeding with full review"
          fi
          
          # Clean up temporary files
          rm -f all_changed_files.txt priority_files.txt medium_priority_files.txt temp_file_diff.txt

      - name: Review PR with GitHub Models
        id: review_with_github_models
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the diff
            let prDiff = '';
            try {
              prDiff = fs.readFileSync('pr_diff.txt', 'utf8');
            } catch (error) {
              console.log('No diff file found or empty diff');
              return;
            }
            
            if (!prDiff.trim()) {
              console.log('Empty diff, skipping review');
              return;
            }

            const prompt = `You are an expert code reviewer. Analyze the provided git diff and deliver a comprehensive, professional code review. Adhere strictly to the following formatting and content guidelines:

            ### IMPORTANT FORMATTING REQUIREMENTS:
            1. Use proper markdown with clear sections and structured formatting.
            2. Include relevant code snippets as examples using triple backticks, specifying the language.
            3. Use tables for presenting structured data when applicable.
            4. Organize content with clear headings and subheadings.
            5. Provide specific line references to the code whenever possible.
            6. Highlight both problems and suggested solutions for improvement.
            7. Use blockquotes for emphasizing critical notes.
            8. Maintain a professional tone—do not include emojis.

            ### STRUCTURE YOUR REVIEW AS FOLLOWS:

            #### ## Code Review Summary
            Provide a brief overview of the changes included in the diff and an overall assessment of their quality.

            #### ## Critical Issues
            List high-priority issues that require immediate attention, explaining their potential impacts and providing clear guidance for resolution.

            #### ## Code Quality Analysis
            Break down the analysis into the following subcategories:
            - **### Security Concerns**: Highlight security issues, providing context and code examples.
            - **### Performance Issues**: Identify performance problems and offer optimization suggestions.
            - **### Best Practices**: Note violations of coding standards or areas for improvement based on best practices.

            #### ## Detailed Findings
            Present detailed observations in a structured table format:

            | Category        | Issue Description              | Location (File:Line) | Severity (High/Medium/Low) | Recommendation        |
            |-----------------|--------------------------------|-----------------------|----------------------------|-----------------------|
            | <Category>      | <Description of the issue>    | <File name>:<Line No> | <Severity level>           | <Suggested solution>  |

            #### ## Code Examples
            Provide clear examples to illustrate issues and solutions:
            - **### Current Implementation**: Show the problematic code snippet and explain why it is an issue.
            - **### Suggested Improvements**: Present the corrected or improved version of the code with explanations.

            #### ## Testing Recommendations
            Include specific recommendations for tests that should be added or updated to ensure code quality and functionality.

            #### ## Documentation Notes
            Suggest improvements or additions to documentation that would enhance clarity and maintainability.

            ---

            ### Context-Specific Instruction
            - Ensure that the review is to the point and contextual to the provided code.
            - Avoid truncating code snippets; include full examples where necessary for clarity.
            - Present findings in a way that is logical, intuitive, and easy to follow.

            Here is the diff to review:
            \`\`\`diff
            ${prDiff}
            \`\`\``;

            try {
              // Call GitHub Models API
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${{ secrets.GH_PAT_MODELS }}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'GitHub-Actions-PR-Review/1.0'
                },
                body: JSON.stringify({
                  messages: [
                    {
                      role: "system",
                      content: "You are a senior software engineer conducting a thorough code review. Provide detailed, actionable feedback with proper markdown formatting. Focus on security, performance, maintainability, and best practices. Include specific code examples and structured recommendations."
                    },
                    {
                      role: "user",
                      content: prompt
                    }
                  ],
                  model: "gpt-4o-mini",
                  temperature: 0.1,
                  max_tokens: 4000
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`GitHub Models API error: ${response.status} ${response.statusText} - ${errorText}`);
              }

              const data = await response.json();
              const reviewContent = data.choices[0].message.content;
              
              // Store review content in temp file 
              fs.writeFileSync('review_content.txt', reviewContent, 'utf8');
              
              // Create PR comment with improved formatting
              const reviewComment = `## AI Code Review Report

            ${reviewContent}

            ---
            **Review Details:**
            - **Model:** GitHub Models GPT-4o-mini
            - **Generated:** ${new Date().toLocaleString()}
            - **Diff Size:** ${prDiff.length} characters

            > This review is generated by AI and should be used as a starting point for human review. Always verify suggestions before implementing changes.`;

                          await github.rest.issues.createComment({
                            issue_number: context.issue.number,
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            body: reviewComment
                          });

                          console.log('✅ PR review comment posted successfully');
                          
                        } catch (error) {
                          console.error('Error calling GitHub Models API:', error);
                          
                          // Post error comment to PR
                          await github.rest.issues.createComment({
                            issue_number: context.issue.number,
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            body: `## AI Code Review - Error

            An error occurred while generating the code review:

            \`\`\`
            ${error.message}
            \`\`\`

            Please check the workflow logs for more details.`
                          });
                          
                          core.setFailed('Failed to generate AI review: ' + error.message);
                        }

      - name: Show diff info
        if: always()
        run: |
          if [ -f pr_diff.txt ]; then
            echo "Diff file size: $(wc -c < pr_diff.txt) bytes"
            echo "Diff line count: $(wc -l < pr_diff.txt) lines"
          else
            echo "No diff file found"
          fi