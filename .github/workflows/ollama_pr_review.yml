name: GitHub Models PR Review

on:
  pull_request:
    branches:
      - llm2
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_review:
    name: AI-Powered PR Review with GitHub Models
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
      - name: Check diff size and truncate if needed
        run: |
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          echo "Diff size: $DIFF_SIZE bytes"
          
          # GitHub Models typically have token limits, so truncate large diffs
          if [ $DIFF_SIZE -gt 50000 ]; then
            echo "Diff too large, truncating to first 50000 characters..."
            head -c 50000 pr_diff.txt > pr_diff_truncated.txt
            mv pr_diff_truncated.txt pr_diff.txt
            echo "--- DIFF TRUNCATED DUE TO SIZE ---" >> pr_diff.txt
          fi

      - name: Review PR with GitHub Models
        id: review_with_github_models
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the diff
            let prDiff = '';
            try {
              prDiff = fs.readFileSync('pr_diff.txt', 'utf8');
            } catch (error) {
              console.log('No diff file found or empty diff');
              return;
            }
            
            if (!prDiff.trim()) {
              console.log('Empty diff, skipping review');
              return;
            }

            const prompt = "You are an expert code reviewer. Analyze this git diff and provide a comprehensive review.\n\n" +
              "IMPORTANT FORMATTING REQUIREMENTS:\n" +
              "1. Use proper markdown formatting with clear sections\n" +
              "2. Include code snippets for examples (use triple backticks with language)\n" +
              "3. Use tables for structured data when appropriate\n" +
              "4. Use clear headings and subheadings\n" +
              "5. Provide specific line references when possible\n" +
              "6. Include both problems and solutions\n" +
              "7. Use > blockquotes for important notes\n" +
              "8. NO emojis - keep it professional\n\n" +
              "Structure your review as follows:\n\n" +
              "## Code Review Summary\n" +
              "[Brief overview of changes and overall assessment]\n\n" +
              "## Critical Issues\n" +
              "[High priority issues that must be addressed]\n\n" +
              "## Code Quality Analysis\n\n" +
              "### Security Concerns\n" +
              "[Security issues with code examples]\n\n" +
              "### Performance Issues\n" +
              "[Performance problems with suggestions]\n\n" +
              "### Best Practices\n" +
              "[Coding standard violations and improvements]\n\n" +
              "## Detailed Findings\n\n" +
              "| Category | Issue | Location | Severity | Recommendation |\n" +
              "|----------|-------|----------|----------|-----------------|\n" +
              "| [Category] | [Description] | [File:Line] | [High/Medium/Low] | [Solution] |\n\n" +
              "## Code Examples\n\n" +
              "### Current Implementation\n" +
              "[Show problematic code with explanations]\n\n" +
              "### Suggested Improvements\n" +
              "[Show improved code with explanations]\n\n" +
              "## Testing Recommendations\n" +
              "[Specific tests that should be added]\n\n" +
              "## Documentation Notes\n" +
              "[Documentation improvements needed]\n\n" +
              "---\n\n" +
              "Here's the diff to review:\n" +
              "```diff\n" +
              prDiff +
              "\n```";

            try {
              // Call GitHub Models API
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${{ secrets.GH_PAT_MODELS }}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'GitHub-Actions-PR-Review/1.0'
                },
                body: JSON.stringify({
                  messages: [
                    {
                      role: "system",
                      content: "You are a senior software engineer conducting a thorough code review. Provide detailed, actionable feedback with proper markdown formatting. Focus on security, performance, maintainability, and best practices. Include specific code examples and structured recommendations."
                    },
                    {
                      role: "user",
                      content: prompt
                    }
                  ],
                  model: "gpt-4o-mini",
                  temperature: 0.1,
                  max_tokens: 4000
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error('GitHub Models API error: ' + response.status + ' ' + response.statusText + ' - ' + errorText);
              }

              const data = await response.json();
              const reviewContent = data.choices[0].message.content;

              // Create PR comment with improved formatting
              const reviewComment = "## AI Code Review Report\n\n" +
                reviewContent + "\n\n" +
                "---\n" +
                "**Review Details:**\n" +
                "- **Model:** GitHub Models gpt-4o-mini\n" +
                "- **Generated:** " + new Date().toLocaleString() + "\n" +
                "- **Diff Size:** " + prDiff.length + " characters\n\n" +
                "> This review is generated by AI and should be used as a starting point for human review. Always verify suggestions before implementing changes.";

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewComment
              });

              console.log('✅ PR review comment posted successfully');
              
            } catch (error) {
              console.error('Error calling GitHub Models API:', error);
              
              // Post error comment to PR
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "## AI Code Review - Error\n\n" +
                      "An error occurred while generating the code review:\n\n" +
                      "```\n" +
                      error.message +
                      "\n```\n\n" +
                      "Please check the workflow logs for more details."
              });
              
              core.setFailed('Failed to generate AI review: ' + error.message);
            }

      - name: Show diff info
        if: always()
        run: |
          if [ -f pr_diff.txt ]; then
            echo "Diff file size: $(wc -c < pr_diff.txt) bytes"
            echo "Diff line count: $(wc -l < pr_diff.txt) lines"
          else
            echo "No diff file found"
          fi