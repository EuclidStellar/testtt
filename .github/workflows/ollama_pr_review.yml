name: GitHub Models PR Review

on:
  pull_request:
    branches:
      - llm2
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_review:
    name: AI-Powered PR Review with GitHub Models
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
      - name: Check diff size and truncate if needed
        run: |
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          echo "Diff size: $DIFF_SIZE bytes"
          
          # GitHub Models typically have token limits, so truncate large diffs
          if [ $DIFF_SIZE -gt 50000 ]; then
            echo "Diff too large, truncating to first 50000 characters..."
            head -c 50000 pr_diff.txt > pr_diff_truncated.txt
            mv pr_diff_truncated.txt pr_diff.txt
            echo "--- DIFF TRUNCATED DUE TO SIZE ---" >> pr_diff.txt
          fi

      - name: Review PR with GitHub Models
        id: review_with_github_models
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the diff
            let prDiff = '';
            try {
              prDiff = fs.readFileSync('pr_diff.txt', 'utf8');
            } catch (error) {
              console.log('No diff file found or empty diff');
              return;
            }
            
            if (!prDiff.trim()) {
              console.log('Empty diff, skipping review');
              return;
            }

            const prompt = `You are an expert code reviewer. Analyze this git diff and provide a concise review focusing on:

            - Code quality and best practices
            - Potential bugs or security issues  
            - Performance considerations
            - Readability and maintainability
            - Missing tests or documentation

            Provide actionable feedback in markdown format. Be concise but thorough.

            Here's the diff:
            \`\`\`diff
            ${prDiff}
            \`\`\``;

            try {
              // Call GitHub Models API
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  // Use the new PAT secret instead of the default token
                  'Authorization': `Bearer ${{ secrets.GH_PAT_MODELS }}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'GitHub-Actions-PR-Review/1.0'
                },
                body: JSON.stringify({
                  messages: [
                    {
                      role: "system",
                      content: "You are an expert code reviewer. Provide concise, actionable feedback."
                    },
                    {
                      role: "user",
                      content: prompt
                    }
                  ],
                  model: "gpt-4o-mini", // Available GitHub Models
                  temperature: 0.1,
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`GitHub Models API error: ${response.status} ${response.statusText} - ${errorText}`);
              }

              const data = await response.json();
              const reviewContent = data.choices[0].message.content;

              // Create PR comment (FIXED formatting)
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 AI Code Review (GitHub Models - GPT-4o-mini)
                ${reviewContent}
                
                *Review generated using GitHub Models API*`
              });

              console.log('✅ PR review comment posted successfully');
              
            } catch (error) {
              console.error('Error calling GitHub Models API:', error);
              core.setFailed(`Failed to generate AI review: ${error.message}`);
            }

      - name: Show diff info
        if: always()
        run: |
          if [ -f pr_diff.txt ]; then
            echo "Diff file size: $(wc -c < pr_diff.txt) bytes"
            echo "Diff line count: $(wc -l < pr_diff.txt) lines"
          else
            echo "No diff file found"
          fi