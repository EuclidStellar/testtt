name: AI Code Review (Transformers Pipeline)

on:
  pull_request:
    branches:
      - main
      - llm
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code_review_job:
    name: Transformers Pipeline Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          echo "--- Installing Transformers and its backends ---"
          pip install "transformers[torch]" accelerate "llama-cpp-python[server]"

      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          if [ -s "pr_diff.txt" ]; then
            echo "diff_exists=true" >> $GITHUB_OUTPUT
          else
            echo "diff_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Review with Transformers Pipeline
        if: steps.get_diff.outputs.diff_exists == 'true'
        id: run_review
        run: |
          python - <<'EOF'
          import torch
          from transformers import pipeline
          import os

          # 1. Prepare the prompt
          try:
              with open('pr_diff.txt', 'r') as f:
                  diff_content = f.read()
          except FileNotFoundError:
              print("Diff file not found.")
              diff_content = ""

          if not diff_content.strip():
              print("Diff content is empty. Skipping review.")
              with open('final_review.md', 'w') as f:
                  f.write("")
          else:
              prompt_template = """<|begin_of_text|><|start_header_id|>user<|end_header_id|>

              You are an expert code reviewer. Analyze the following git diff and provide a concise review. Focus on bugs, style, and improvements.

              ## Summary
              A brief, one-sentence summary of the changes.

              ## Findings & Suggestions
              Use a table with columns for 'File', 'Line(s)', and 'Comment'.

              ## Critical Issues
              Highlight any critical issues here. If none, state 'No critical issues found.'.

              Here is the git diff:
              ```diff
              {diff}
              ```<|eot_id|><|start_header_id|>assistant<|end_header_id|>
              """
              
              full_prompt = prompt_template.format(diff=diff_content)

              # 2. Initialize and run the pipeline
              print("--- Initializing pipeline and loading model ---")
              
              # THE FIX IS HERE: The `model_kwargs` for 4-bit loading has been removed.
              # This is correct because GGUF files are already quantized.
              pipe = pipeline(
                  "text-generation",
                  model="unsloth/gpt-oss-20b-GGUF",
                  torch_dtype=torch.bfloat16,
                  device_map="auto",
              )

              print("--- Generating AI review ---")
              outputs = pipe(
                  full_prompt,
                  max_new_tokens=2048,
                  do_sample=True,
                  temperature=0.6,
                  top_p=0.9,
              )
              
              review_text = outputs[0]['generated_text']
              review_only = review_text.split("<|start_header_id|>assistant<|end_header_id|>")[1].strip()

              print("--- Raw output from model ---")
              print(review_only)

              # 3. Save the output
              with open('final_review.md', 'w') as f:
                  f.write(review_only)
              print("--- Review saved to final_review.md ---")
          EOF

      - name: Post PR Comment
        if: always() && steps.get_diff.outputs.diff_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('final_review.md')) {
                const reviewOutput = fs.readFileSync('final_review.md', 'utf8').trim();

                if (reviewOutput) {
                    github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `## 🤖 AI Code Review\n\n**Model:** \`unsloth/gpt-oss-20b-GGUF\` (via Transformers)\n\n---\n\n${reviewOutput}`
                    });
                } else {
                    console.log('Review file is empty. Skipping PR comment.');
                }
            } else {
                console.log('Review file not found. Skipping PR comment.');
            }