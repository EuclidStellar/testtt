name: AI Code Review (Unsloth gpt-oss-20b)

on:
  pull_request:
    branches:
      - main
      - llm
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code_review_job:
    name: Direct GGUF Code Review with Unsloth Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          echo "--- Installing Python libraries ---"
          pip install --upgrade --force-reinstall --no-cache-dir "llama-cpp-python[server]"
          pip install huggingface_hub

      - name: Download GGUF Model
        id: download_model
        run: |
          # --- Using the new model from Unsloth as requested ---
          REPO_ID="unsloth/gpt-oss-20b-GGUF"
          MODEL_FILE="gpt-oss-20b-Q4_K_M.gguf"

          echo "MODEL_FILE_PATH=$(pwd)/$MODEL_FILE" >> $GITHUB_OUTPUT

          echo "--- Downloading GGUF model file: $MODEL_FILE ---"
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='$REPO_ID', filename='$MODEL_FILE', local_dir='.', local_dir_use_symlinks=False)"
          
          echo "--- Verifying downloaded file ---"
          ls -lh $MODEL_FILE
      
      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          if [ -s "pr_diff.txt" ]; then
            echo "diff_exists=true" >> $GITHUB_OUTPUT
          else
            echo "diff_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Review with Python Script
        if: steps.get_diff.outputs.diff_exists == 'true'
        id: run_review
        run: |
          python - <<'EOF'
          from llama_cpp import Llama
          import os

          # 1. Load the model
          llm = Llama(
              model_path="${{ steps.download_model.outputs.MODEL_FILE_PATH }}",
              n_ctx=4096,
              n_gpu_layers=-1,
              verbose=True
          )

          # 2. Prepare the prompt
          try:
              with open('pr_diff.txt', 'r') as f:
                  diff_content = f.read()
          except FileNotFoundError:
              print("Diff file not found.")
              diff_content = ""

          if not diff_content.strip():
              print("Diff content is empty. Skipping review.")
              with open('final_review.md', 'w') as f:
                  f.write("")
          else:
              prompt_template = """You are an expert code reviewer for a GitHub pull request. Your task is to analyze the following code changes and provide a concise, helpful review. Focus on identifying potential bugs, style issues, security vulnerabilities, and areas for improvement. Do not repeat the code from the diff in your answer. Structure your response in Markdown with the following sections:

              ## Summary
              A brief, one-sentence summary of the changes.

              ## Findings & Suggestions
              Use a table with columns for 'File', 'Line(s)', and 'Comment' to list your findings. If a finding is not specific to a line, use 'N/A'.

              ## Critical Issues
              Highlight any critical issues or major concerns here. If none, state 'No critical issues found.'.

              Here is the git diff:
              ```diff
              {diff}
              ```"""
              
              full_prompt = prompt_template.format(diff=diff_content)

              # 3. Run inference
              print("--- Generating AI review ---")
              output = llm(
                  full_prompt,
                  max_tokens=2048,
                  stop=["```"],
                  echo=False
              )

              review_text = output["choices"][0]["text"].strip()
              print("--- Raw output from model ---")
              print(review_text)

              # 4. Save the output
              with open('final_review.md', 'w') as f:
                  f.write(review_text)
              print("--- Review saved to final_review.md ---")
          EOF

      - name: Post PR Comment
        if: always() && steps.get_diff.outputs.diff_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('final_review.md')) {
                const reviewOutput = fs.readFileSync('final_review.md', 'utf8').trim();

                if (reviewOutput) {
                    github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        // Updated model name for the comment
                        body: `## 🤖 AI Code Review\n\n**Model:** \`unsloth/gpt-oss-20b-GGUF\`\n\n---\n\n${reviewOutput}`
                    });
                } else {
                    console.log('Review file is empty. Skipping PR comment.');
                }
            } else {
                console.log('Review file not found. Skipping PR comment.');
            }