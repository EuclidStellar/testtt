name: AI Code Review (llama-cli)

on:
  pull_request:
    branches:
      - main
      - llm
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code_review_job:
    name: llama.cpp CLI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          # THE FIX IS HERE: Added 'libcurl4-openssl-dev' to the list.
          # This provides the necessary CURL library for the -hf download feature.
          sudo apt-get update && sudo apt-get install -y build-essential cmake jq libcurl4-openssl-dev

      - name: Clone and Build llama.cpp
        id: build_llama
        run: |
          echo "--- Cloning llama.cpp repository ---"
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          
          echo "--- Configuring project with CMake ---"
          mkdir build
          cd build
          cmake ..

          echo "--- Compiling llama-cli with CMake ---"
          cmake --build . --config Release

          # The executable is now inside the build/bin directory
          echo "CLI_PATH=$(pwd)/bin/llama-cli" >> $GITHUB_OUTPUT
          
      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          if [ -s "pr_diff.txt" ]; then
            echo "diff_exists=true" >> $GITHUB_OUTPUT
          else
            echo "diff_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Review with llama-cli
        if: steps.get_diff.outputs.diff_exists == 'true'
        id: run_review
        run: |
          CLI_PATH="${{ steps.build_llama.outputs.CLI_PATH }}"
          
          # 1. Create the Jinja2 prompt template file
          cat <<'EOF' > prompt.j2
          <|begin_of_text|><|start_header_id|>user<|end_header_id|>
          You are an expert code reviewer. Analyze the following git diff and provide a concise review. Focus on bugs, style, and improvements.
          
          ## Summary
          A brief, one-sentence summary of the changes.
          
          ## Findings & Suggestions
          Use a table with columns for 'File', 'Line(s)', and 'Comment'.
          
          ## Critical Issues
          Highlight any critical issues here. If none, state 'No critical issues found.'.
          
          Here is the git diff:
          ```diff
          {{ diff }}
          ```<|eot_id|><|start_header_id|>assistant<|end_header_id|>
          EOF

          # 2. Safely package the diff content into a JSON file for the template
          DIFF_CONTENT=$(cat pr_diff.txt)
          jq -n --arg diff "$DIFF_CONTENT" '{"diff": $diff}' > data.json
          
          echo "--- Generating AI review using llama-cli ---"
          # 3. Execute llama-cli with your specified flags
          "$CLI_PATH" \
              -hf unsloth/gpt-oss-20b-GGUF:F16 \
              --jinja \
              -ngl 99 \
              --threads $(nproc) \
              --ctx-size 16384 \
              --temp 1.0 \
              --top-p 1.0 \
              --top-k 0 \
              -f prompt.j2 \
              --jinja-data-file data.json \
              --no-display-prompt \
              -n 2048 \
              > final_review.md

          echo "--- Review saved to final_review.md ---"
          cat final_review.md

      - name: Post PR Comment
        if: always() && steps.get_diff.outputs.diff_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('final_review.md')) {
                const reviewOutput = fs.readFileSync('final_review.md', 'utf8').trim();

                if (reviewOutput) {
                    github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `## 🤖 AI Code Review\n\n**Model:** \`unsloth/gpt-oss-20b-GGUF:F16\` (via llama-cli)\n\n---\n\n${reviewOutput}`
                    });
                } else {
                    console.log('Review file is empty. Skipping PR comment.');
                }
            } else {
                console.log('Review file not found. Skipping PR comment.');
            }